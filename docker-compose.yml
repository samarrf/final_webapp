services:
  php:
    build:
      context: ./backend
    container_name: homeease-php
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: homeease
      DB_USER: homeease_app
      DB_PASS: devpassword

      MONGO_URI: mongodb://mongodb:27017

      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: homeease-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: homeease
      MYSQL_USER: homeease_app
      MYSQL_PASSWORD: devpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-prootpassword"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8
    container_name: homeease-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: homeease-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  mailpit:
    image: axllent/mailpit:latest
    container_name: homeease-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mysql_data:
  mongodb_data:
  redis_data: